[project]
name = "pulse-mq"
version = "7.2.3"
description = "高性能 Client/Server 消息中间件 — ZeroMQ ROUTER/DEALER + bcrypt 认证 + 实时监控"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "haifeng" },
]
keywords = ["mq", "zmq", "pubsub", "finance", "market-data", "realtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "pyzmq>=26.0",
    "msgspec>=0.18",
    "python-snappy>=0.7",
    "lz4>=4.0",
    "zstandard>=0.22",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "loguru>=0.7",
    "bcrypt>=4.0",
]

[project.urls]
Homepage = "https://github.com/haifeng/pulse-mq"
Repository = "https://github.com/haifeng/pulse-mq"
Issues = "https://github.com/haifeng/pulse-mq/issues"

[project.scripts]
pulsemq = "pulsemq.cli.server:main"
pulsemq-server = "pulsemq.cli.server:main"
pulsemq-users = "pulsemq.cli.users:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsemq"]
artifacts = ["src/pulsemq/admin/static/*.js"]

[tool.hatch.build.targets.sdist]
exclude = ["nul"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "build>=1.5.0",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
